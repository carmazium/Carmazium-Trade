name: Apply final unified CarMazium integration

on:
  push:
    branches:
      - final-unified-carmazium-2026-09-10

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and integrity-check source patch
        shell: bash
        run: |
          : > /tmp/final-unified.patch
          for part in .carmazium-integration/patch.part-{01..18}; do
            cat "$part" >> /tmp/final-unified.patch
            if [ "$part" = ".carmazium-integration/patch.part-17" ]; then
              printf '+\n' >> /tmp/final-unified.patch
            fi
          done
          sed -i 's/^ diff --git /diff --git /' /tmp/final-unified.patch
          echo "001bd08f742daf17dee35b192f2b491b38af09dd389419d9be1e9509a180e3a3  /tmp/final-unified.patch" | sha256sum -c -

      - name: Apply remaining source changes
        shell: bash
        run: |
          git apply --3way --index \
            --exclude=.env.example \
            --exclude=backend/.env.example \
            --exclude=src/lib/tradexchangeApi.ts \
            /tmp/final-unified.patch

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://carmazium-hjoh9w.fly.dev
          NEXT_PUBLIC_SUPABASE_URL: https://bwtnzmevjlowwronylxm.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Build backend
        working-directory: backend
        run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/carmazium_ci

      - name: Commit verified unified source and remove staging machinery
        shell: bash
        run: |
          git config user.name "carmazium-integration-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf .carmazium-integration
          rm -f .github/workflows/apply-final-unified-carmazium.yml
          git add -A
          git commit -m "feat: unify CarMazium UI, TradeXchange and Supabase"
          git push origin HEAD:${GITHUB_REF_NAME}
