name: Final corrections 90-95 verification

on:
  push:
    branches:
      - final/carmazium-completion
    paths:
      - .github/workflows/final-corrections-90-95.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/carmazium_ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/carmazium_ci
    steps:
      - name: Check out completion branch
        uses: actions/checkout@v4
        with:
          ref: final/carmazium-completion

      - name: Apply final correctness patch
        run: python .github/scripts/final_corrections_90_95.py

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Verify backend
        working-directory: backend
        run: |
          npm ci
          npx prisma validate
          npm run build
          npm test -- --runInBand payments/payments.service.spec.ts auth/auth-security.spec.ts

      - name: Verify frontend remains production-build clean
        run: |
          npm ci
          npm run build

      - name: Commit verified corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/main.ts backend/src/payments/payments.service.ts backend/src/payments/payments.service.spec.ts
          if git diff --cached --quiet; then
            echo "No correction changes to commit"
            exit 0
          fi
          git commit -m "fix(security): make sessions and repeated auction refunds fail safe"
          git pull --rebase origin final/carmazium-completion
          git push origin HEAD:final/carmazium-completion
