name: Business rules 85-90 verification

on:
  push:
    branches:
      - final/carmazium-completion
    paths:
      - .github/workflows/business-rules-85-90.yml
      - .github/scripts/business_rules_85_90.py

permissions:
  contents: write

jobs:
  patch-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out completion branch
        uses: actions/checkout@v4
        with:
          ref: final/carmazium-completion

      - name: Apply customer-facing and HPI rule patches
        run: python .github/scripts/business_rules_85_90.py

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify backend build and targeted regressions
        working-directory: backend
        run: |
          npm ci
          npm run build
          npm test -- --runInBand payments.service.spec.ts services.service.spec.ts

      - name: Verify frontend production build
        run: |
          npm ci
          npm run build

      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/terms/page.tsx src/app/checkout/success/page.tsx src/components/listing/ListingWizard.tsx backend/src/email/email.service.ts backend/src/listings/listings.service.ts backend/src/admin/admin.service.ts backend/src/auctions/auctions.controller.ts render.yaml .env.example
          git commit -m "fix(rules): align fees HPI and customer money flow"
          git push origin HEAD:final/carmazium-completion
