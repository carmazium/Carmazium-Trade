name: Final security 95-100

on:
  push:
    branches:
      - final/carmazium-completion
    paths:
      - .github/workflows/final-security-95-100.yml

permissions:
  contents: write

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out completion branch
        uses: actions/checkout@v4
        with:
          ref: final/carmazium-completion

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Apply patched backend transitive overrides
        working-directory: backend
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          p.overrides = {
            ...(p.overrides || {}),
            'multer': '2.3.0',
            'deepmerge-ts': '8.0.2',
            'brace-expansion@1.1.12': '1.1.18'
          };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
          npm install

      - name: Verify backend compatibility and security
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/carmazium
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/carmazium
        run: |
          npm ci
          node - <<'NODE'
          const bcrypt = require('bcrypt');
          (async () => {
            const hash = await bcrypt.hash('carmazium-final-security-smoke-test', 4);
            if (!(await bcrypt.compare('carmazium-final-security-smoke-test', hash))) {
              throw new Error('bcrypt smoke test failed');
            }
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
          npx prisma validate
          npm run build
          npm test -- --runInBand payments/payments.service.spec.ts services/services.service.spec.ts auth/auth-security.spec.ts
          npm audit --omit=dev --json > /tmp/backend-final-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/backend-final-audit.json', 'utf8'));
          const v = d.metadata?.vulnerabilities || {};
          console.log('backend final production audit', v);
          if ((v.critical || 0) !== 0) throw new Error('Backend still has critical production vulnerabilities');
          if ((v.high || 0) !== 0) throw new Error('Backend still has high production vulnerabilities');
          NODE

      - name: Verify frontend remains clean
        run: |
          npm ci
          npm run build
          npm audit --omit=dev --json > /tmp/frontend-final-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/frontend-final-audit.json', 'utf8'));
          const v = d.metadata?.vulnerabilities || {};
          console.log('frontend final production audit', v);
          if ((v.critical || 0) !== 0 || (v.high || 0) !== 0) {
            throw new Error('Frontend has high/critical production vulnerabilities');
          }
          NODE

      - name: Upload final audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-security-audits
          path: |
            /tmp/backend-final-audit.json
            /tmp/frontend-final-audit.json
          retention-days: 1

      - name: Commit verified overrides
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency override changes to commit"
            exit 0
          fi
          git commit -m "fix(deps): eliminate remaining high production advisories"
          git push origin HEAD:final/carmazium-completion
