name: Production hardening 90-95 verification

on:
  push:
    branches:
      - final/carmazium-completion
    paths:
      - .github/workflows/production-hardening-90-95.yml

permissions:
  contents: write

jobs:
  harden-build-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/carmazium_ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/carmazium_ci
    steps:
      - name: Check out completion branch
        uses: actions/checkout@v4
        with:
          ref: final/carmazium-completion

      - name: Apply production-hardening patch
        run: |
          python .github/scripts/production_hardening_90_95.py
          python .github/scripts/frontend_hpi_resume_fix.py

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Validate Prisma schema
        working-directory: backend
        run: npx prisma validate

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Test payment rules
        working-directory: backend
        run: npm test -- --runInBand payments/payments.service.spec.ts

      - name: Test service marketplace
        working-directory: backend
        run: npm test -- --runInBand services/services.service.spec.ts

      - name: Test auth trust boundary
        working-directory: backend
        run: npm test -- --runInBand auth/auth-security.spec.ts

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify frontend production build
        id: frontend_build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee frontend-build.log
          code=${PIPESTATUS[0]}
          exit $code

      - name: Upload frontend build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-log
          path: frontend-build.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src src
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix(security): harden auth auction relists and failed-sale refunds"
          git pull --rebase origin final/carmazium-completion
          git push origin HEAD:final/carmazium-completion
