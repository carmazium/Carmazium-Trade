name: Final CarMazium completion gate

on:
  push:
    branches:
      - final/carmazium-completion
    paths:
      - .github/workflows/final-validation-100.yml

jobs:
  final-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out completion branch
        uses: actions/checkout@v4
        with:
          ref: final/carmazium-completion

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Verify backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/carmazium
          DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/carmazium
        run: |
          test ! -e src/core/interceptors/listing-privacy.interceptor.ts
          npm ci
          npx prisma validate
          npm run build
          npm test -- --runInBand payments/payments.service.spec.ts services/services.service.spec.ts auth/auth-security.spec.ts listings/listing-privacy.interceptor.spec.ts
          npm audit --omit=dev --json > /tmp/backend-final.json || true
          node <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/backend-final.json', 'utf8'));
          const v = d.metadata?.vulnerabilities || {};
          console.log('backend production audit', v);
          if ((v.critical || 0) || (v.high || 0)) process.exit(1);
          NODE

      - name: Verify frontend
        run: |
          npm ci
          npm run build
          npm audit --omit=dev --json > /tmp/frontend-final.json || true
          node <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/frontend-final.json', 'utf8'));
          const v = d.metadata?.vulnerabilities || {};
          console.log('frontend production audit', v);
          if ((v.critical || 0) || (v.high || 0)) process.exit(1);
          NODE
